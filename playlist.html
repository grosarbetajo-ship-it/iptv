<main class="container"><section class="page-head"><div class="kicker">Playlist tools</div><h1 style="font-size:clamp(38px,5vw,58px)">Импорт и экспорт M3U</h1><p>Импортированные каналы сохраняются только в localStorage браузера. Сервер не требуется.</p></section>
